[profile.profiling]
inherits = "release"
debug = true

# Enable cdylib builds for musl targets by disabling static C runtime linking
# This is required for Ruby native extensions on Alpine Linux
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
